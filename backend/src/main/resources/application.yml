server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: sharman-backend
  datasource:
    url: jdbc:h2:mem:sharmandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Security & OAuth Configuration (Placeholder / Dev setup)
sharman:
  security:
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:sharman-dev-client-id}
        client-secret: ${GOOGLE_CLIENT_SECRET:sharman-dev-client-secret}
  ai:
    model: gemini-pro
    temperature: 0.2

logging:
  level:
    root: INFO
    com.sharman: DEBUG
