<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181d23"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <rect x="126" y="126" width="772" height="772" rx="180" fill="none" stroke="#92f29b" stroke-opacity=".32" stroke-width="20"/>
  <g fill="#92f29b" filter="url(#glow)">
    <rect x="272" y="318" width="480" height="54" rx="27"/>
    <rect x="272" y="485" width="320" height="54" rx="27"/>
    <rect x="272" y="652" width="480" height="54" rx="27"/>
  </g>
</svg>
